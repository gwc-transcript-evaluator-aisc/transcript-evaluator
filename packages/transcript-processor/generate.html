<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcript Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2rem;
      width: 100%;
      max-width: 500px;
    }
    h1 { font-size: 1.5rem; font-weight: 700; color: #2d3748; text-align: center; margin-bottom: 1rem; }
    p { font-size: .9rem; color: #718096; text-align: center; margin-bottom: 1.5rem; }
    label { font-size: .85rem; color: #4a5568; font-weight: 500; display: block; margin-bottom: .3rem; }
    input[type="number"] {
      width: 100%;
      padding: .5rem;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    button {
      display: block;
      width: 100%;
      padding: .75rem;
      background: #4299e1;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #3182ce; }
    #status { margin-top: 1rem; font-size: .85rem; color: #276749; text-align: center; min-height: 1.5em; }
  </style>
</head>
<body>

<div class="card">
  <h1>Transcript Generator</h1>
  <p>Generate random student transcript PDFs for testing. Files download automatically.</p>

  <label for="count">Number of transcripts</label>
  <input type="number" id="count" value="5" min="1" max="50" />

  <button onclick="generateAll()">Generate & Download</button>
  <div id="status"></div>
</div>

<script>
const { jsPDF } = window.jspdf;

// --- Data pools ---
const FIRST_NAMES = ["James","Mary","Robert","Patricia","John","Jennifer","Michael","Linda","David","Elizabeth","William","Barbara","Richard","Susan","Joseph","Jessica","Thomas","Sarah","Daniel","Karen","Matthew","Lisa","Anthony","Nancy","Mark","Betty","Steven","Margaret","Andrew","Sandra","Joshua","Ashley","Kevin","Kimberly","Brian","Emily","George","Donna","Ryan","Carol","Nathan","Stephanie","Carlos","Maria","Wei","Yuki","Amir","Priya","Jamal","Fatima","Hiroshi","Ananya","Omar","Svetlana"];
const LAST_NAMES = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell","Kim","Chen","Patel","Singh","Tanaka"];
const INSTITUTIONS = ["South Puget Sound Community College","University of Bridgeport","Golden West College","Stanbridge University","Portland Community College","Seattle Central College","San Jose State University","University of California Irvine","Oregon State University","Washington State University","Bellevue College","Tacoma Community College","Santa Monica College","Houston Community College","Miami Dade College"];
const PROGRAMS = ["Associate in Arts","Associate in Science","Associate in Pre-Nursing DTA/MRP","Bachelor of Science","Bachelor of Arts","Associate in Applied Science"];
const MAJORS = ["Computer Science","Biology","Nursing","Business Administration","Psychology","English","Mathematics","Dental Hygiene","Criminal Justice","Engineering","Communications","Sociology","Chemistry","Education","Accounting","Graphic Design","Information Technology","Political Science","Economics","Music"];
const DEPTS = ["MATH","ENGL","BIOL","CHEM","PHYS","PSYC","HIST","ECON","CMST","MUSC","ART","SOC","POLS","CS","NURS","ACCT","MGMT","SPAN","PHIL","ANTH"];
const COURSE_NAMES = {
  MATH:["College Algebra","Calculus I","Calculus II","Statistics","Linear Algebra","Precalculus","Discrete Math"],
  ENGL:["English Composition I","English Composition II","Creative Writing","American Literature","Technical Writing"],
  BIOL:["General Biology","Human Anatomy & Physiology I","Human Anatomy & Physiology II","Microbiology","Genetics"],
  CHEM:["General Chemistry I","General Chemistry II","Organic Chemistry I","Biochemistry","Intro to Chemistry"],
  PHYS:["General Physics I","General Physics II","Mechanics","Electromagnetism"],
  PSYC:["Intro to Psychology","Developmental Psychology","Abnormal Psychology","Social Psychology"],
  HIST:["U.S. History to 1877","U.S. History Since 1877","World History I","World History II"],
  ECON:["Microeconomics","Macroeconomics","International Economics"],
  CMST:["Public Speaking","Interpersonal Communication","Mass Communication"],
  MUSC:["Music Appreciation","Music Fundamentals","Music Theory I"],
  ART:["Art Appreciation","Drawing I","Painting I","Art History"],
  SOC:["Introduction to Sociology","Race and Ethnicity","Social Problems"],
  POLS:["American Government","Comparative Politics","International Relations"],
  CS:["Intro to Computer Science","Programming I","Programming II","Data Structures","Web Development"],
  NURS:["Nursing Fundamentals I","Nursing Fundamentals II","Pharmacology","Clinical Practice I"],
  ACCT:["Financial Accounting","Managerial Accounting","Cost Accounting"],
  MGMT:["Principles of Management","Organizational Behavior","Human Resources"],
  SPAN:["Spanish I","Spanish II","Intermediate Spanish"],
  PHIL:["Introduction to Philosophy","Ethics","Logic"],
  ANTH:["Cultural Anthropology","Physical Anthropology","Archaeology"],
};
const GRADES = ["A","A-","B+","B","B-","C+","C","C-","D+","D","F"];
const GP = {A:4.0,"A-":3.67,"B+":3.33,B:3.0,"B-":2.67,"C+":2.33,C:2.0,"C-":1.67,"D+":1.33,D:1.0,F:0.0};
const SEMESTERS = ["FALL","WINTER","SPRING","SUMMER"];

function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }

function generateStudent() {
  const first = pick(FIRST_NAMES), last = pick(LAST_NAMES);
  return {
    name: `${first} ${last}`,
    id: String(randInt(100000,999999)),
    dob: `${String(randInt(1,12)).padStart(2,'0')}/${String(randInt(1,28)).padStart(2,'0')}/${randInt(1985,2004)}`,
    institution: pick(INSTITUTIONS),
    program: pick(PROGRAMS),
    major: pick(MAJORS),
  };
}

function generateCourses() {
  const numSemesters = randInt(3,8);
  const startYear = randInt(2017,2023);
  const courses = [];
  for (let i = 0; i < numSemesters; i++) {
    const sem = SEMESTERS[i % 4];
    const year = startYear + Math.floor(i / 4);
    const numCourses = randInt(2,5);
    for (let j = 0; j < numCourses; j++) {
      const dept = pick(DEPTS);
      const num = randInt(100,399);
      const names = COURSE_NAMES[dept] || ["Special Topics"];
      const name = pick(names);
      const credits = pick([3,4,5,1,2]);
      const grade = pick(GRADES);
      const points = GP[grade] * credits;
      courses.push({ code:`${dept} ${num}`, name, credits, grade, points:Math.round(points*100)/100, semester:`${sem} ${year}` });
    }
  }
  return courses;
}

function createPDF(student, courses) {
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const pageWidth = doc.internal.pageSize.getWidth();
  let y = 50;

  // Title
  doc.setFontSize(14);
  doc.setFont("helvetica","bold");
  doc.text("OFFICIAL TRANSCRIPT OF ACADEMIC RECORD", pageWidth/2, y, {align:"center"});
  y += 18;
  doc.setFontSize(10);
  doc.setFont("helvetica","normal");
  doc.text(student.institution, pageWidth/2, y, {align:"center"});
  y += 28;

  // Student info
  doc.setFontSize(9);
  doc.setFont("helvetica","bold");
  doc.text("Name:", 50, y); doc.setFont("helvetica","normal"); doc.text(student.name, 110, y);
  doc.setFont("helvetica","bold"); doc.text("Student ID:", 320, y); doc.setFont("helvetica","normal"); doc.text(student.id, 390, y);
  y += 14;
  doc.setFont("helvetica","bold"); doc.text("Date of Birth:", 50, y); doc.setFont("helvetica","normal"); doc.text(student.dob, 130, y);
  doc.setFont("helvetica","bold"); doc.text("Program:", 320, y); doc.setFont("helvetica","normal"); doc.text(student.program, 375, y);
  y += 14;
  doc.setFont("helvetica","bold"); doc.text("Major:", 50, y); doc.setFont("helvetica","normal"); doc.text(student.major, 90, y);
  y += 24;

  // Courses by semester
  let currentSem = null;
  let totalCredits = 0, totalPoints = 0;

  for (const c of courses) {
    if (c.semester !== currentSem) {
      currentSem = c.semester;
      y += 10;
      if (y > 700) { doc.addPage(); y = 50; }
      doc.setFontSize(9);
      doc.setFont("helvetica","bold");
      doc.text(c.semester, 50, y);
      y += 12;
      // Header row
      doc.setFont("helvetica","bold");
      doc.text("Course", 50, y); doc.text("Title", 130, y); doc.text("Credits", 380, y); doc.text("Grade", 430, y); doc.text("Points", 480, y);
      y += 3;
      doc.setDrawColor(180); doc.line(50, y, 540, y);
      y += 10;
    }

    if (y > 720) { doc.addPage(); y = 50; }
    doc.setFont("helvetica","normal");
    doc.text(c.code, 50, y);
    doc.text(c.name.substring(0,35), 130, y);
    doc.text(String(c.credits.toFixed(1)), 388, y);
    doc.text(c.grade, 435, y);
    doc.text(c.points.toFixed(2), 483, y);
    y += 12;

    totalCredits += c.credits;
    totalPoints += c.points;
  }

  // Cumulative
  const gpa = totalCredits > 0 ? (totalPoints / totalCredits) : 0;
  y += 20;
  if (y > 700) { doc.addPage(); y = 50; }
  doc.setFont("helvetica","bold");
  doc.setFontSize(10);
  doc.text(`Cumulative GPA: ${gpa.toFixed(3)}`, 50, y);
  y += 14;
  doc.text(`Total Credits Earned: ${totalCredits.toFixed(1)}`, 50, y);
  y += 24;

  // Footer
  doc.setFontSize(7);
  doc.setFont("helvetica","normal");
  doc.text("CONFIDENTIAL RECORD ISSUED IN ACCORDANCE WITH THE FAMILY EDUCATIONAL RIGHTS AND PRIVACY ACT OF 1974", pageWidth/2, y, {align:"center"});
  y += 14;
  doc.setFontSize(8);
  doc.setFont("helvetica","bold");
  doc.text("End of Official Transcript", pageWidth/2, y, {align:"center"});

  return doc;
}

async function generateAll() {
  const count = parseInt(document.getElementById("count").value) || 5;
  const status = document.getElementById("status");
  status.textContent = `Generating ${count} transcript(s)...`;

  // Small delay so status renders
  await new Promise(r => setTimeout(r, 50));

  for (let i = 0; i < count; i++) {
    const student = generateStudent();
    const courses = generateCourses();
    const doc = createPDF(student, courses);
    const filename = `${student.name.replace(/ /g,"_")}_${student.id}.pdf`;
    doc.save(filename);
    status.textContent = `Downloaded ${i+1} of ${count}: ${filename}`;
    await new Promise(r => setTimeout(r, 100)); // small gap between downloads
  }

  status.textContent = `Done! ${count} transcript(s) downloaded.`;
}
</script>
</body>
</html>
